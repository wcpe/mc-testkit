# mc-testkit 持续集成：每个 PR 与 master 推送跑「插件构建 + 单元/集成测试」与「模板 bot 静态检查」。
# 对 PR 而言它是**合并门禁**：代码改动必须经 PR 且本工作流的必需检查通过才能合并（见 CONTRIBUTING §8、ADR-0028）。
# 对直推 master 的提交（仅限发版提交与纯文档更新）它不参与合并判定，但照跑作为**事后告警**。
# 不含实机 E2E（要起真实服务端/代理、重且需联网下载）——那走 e2e.yml（**仅手动触发**，见 e2e.yml / OPERATIONS §1.1）。
# 发版（打 v* tag）由 release.yml 负责，本工作流不处理 tag。
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支 / PR 上有新推送时取消进行中的旧运行，省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 插件本体：编译 + 全部单元 / TestKit 测试（配置期校验，不联网、不起进程）
  # 注意：任务名是分支保护的必需检查名（CONTRIBUTING §8），改名须同步更新仓库分支保护规则。
  build-test:
    name: 构建与测试（插件）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（带依赖 / 构建缓存）
        uses: gradle/actions/setup-gradle@v5

      - name: 构建 + 风格检查 + 测试（编译 + ktlintCheck + 单元/TestKit）
        run: ./gradlew build --no-daemon --stacktrace

      # 模板桩依赖 harness-core。本地开发时它可能来自 mavenLocal、也可能来自远端已发布版本，
      # 但 CI 是全新环境：远端只有**已发布**的那些版本，因此这里先把本分支的 harness-core 发布到
      # mavenLocal，让「校验模板桩可独立编译」编译的是**当前代码**而不是某个旧发布版。
      # 不这么做时，桩一旦用到未发布的新 API（如命令通道），CI 会拿旧构件去编译并报找不到符号。
      - name: 发布 harness-core 到 mavenLocal（供模板桩编译）
        run: ./gradlew -p harness-core publishToMavenLocal --no-daemon --stacktrace

      - name: 校验模板桩骨架可独立编译
        run: ./gradlew -p template/harness compileKotlin --no-daemon --stacktrace

      - name: 归档测试报告（失败时便于排查）
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  # Windows PTY：验证 pty4j 的 ConPTY/WinPty 加载、JLine 依赖与 Windows 下全量构建。
  # 真实 Paper attach 仍留在手动 E2E，避免 CI 受服务端下载与桌面终端环境影响；桩服务端的 PTY 冒烟
  # （PtyAttachConsoleSmokeTest）随全量测试在 Windows 上跑，覆盖 ConPTY 真终端与端点桥接。
  windows-pty:
    name: Windows PTY 构建与测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（带依赖 / 构建缓存）
        uses: gradle/actions/setup-gradle@v5

      - name: 构建与测试（Windows）
        run: .\gradlew.bat build --no-daemon --stacktrace --console=plain

      - name: 归档 Windows 测试报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: windows-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/
          if-no-files-found: ignore

  # 模板机器人：prettier + eslint + 依赖漏洞扫描（见 .claude/rules/static-analysis.md）
  # 注意：任务名是分支保护的必需检查名（CONTRIBUTING §8），改名须同步更新仓库分支保护规则。
  bot-checks:
    name: 静态检查（模板 bot）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/bot
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 18
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 格式检查（prettier）
        run: npx prettier --check .

      - name: 代码检查（eslint）
        run: npx eslint .

      - name: 依赖漏洞扫描（npm audit，仅报告不阻断——多为 mineflayer 传递依赖）
        # `|| true`：避免 continue-on-error 在 Annotations 里留下 error 注解（job 本就不因 audit 失败）
        run: npm audit --audit-level=high || true
