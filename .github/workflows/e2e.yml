# mc-testkit 实机 E2E：自举跑通核心矩阵——单服(±bot) / 经代理 / 集群 / 压测。
# 「自举」= 以 template/ 的桩与 bot 作消费者，真实下载并拉起后端 + 代理，按结果文件判定、收尾。
# 同一套场景/任务名经 -P 选平台跑遍「代理 × 后端」矩阵（不为每个平台另起消费者工程）。
# 重且需联网（下载服务端/代理），故不在每次 PR 跑——手动触发，或打版本 tag 时跑（发版前 E2E，
# 见 .claude/rules/testing-and-quality.md「E2E 在发版前至少跑一遍」）。
name: E2E

on:
  workflow_dispatch: {}        # 手动触发
  push:
    tags: ['v*']               # 打 vX.Y.Z tag 时（发版前实机验收）

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: 自举实机 E2E（smoke + 集群 + 压测）
    runs-on: ubuntu-latest
    timeout-minutes: 40        # 含首跑下载 Paper/Waterfall 的时间
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（Paper / Waterfall 运行所需）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 18（mineflayer 机器人）
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 配置 Gradle（缓存含已下载的服务端/代理 jar，加速重复运行）
        uses: gradle/actions/setup-gradle@v4

      - name: 发布插件到 mavenLocal（供消费者工程引用）
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: 构建模板桩 jar
        run: ./gradlew -p template/harness jar --no-daemon --stacktrace

      - name: 安装模板 bot 依赖
        working-directory: template/bot
        run: npm install --no-audit --no-fund

      - name: 生成一次性消费者工程（经 mavenLocal 引用插件，平台经 -P 参数化）
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          CONSUMER="$RUNNER_TEMP/e2e-consumer"
          mkdir -p "$CONSUMER"
          cat > "$CONSUMER/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  mavenLocal()
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = "mc-testkit-e2e-ci"
          EOF
          cat > "$CONSUMER/build.gradle.kts" <<EOF
          plugins { id("top.wcpe.mc-testkit") version "$VERSION" }

          // CI 经 -P 选平台，同一套场景/任务名跑遍「代理 × 后端」矩阵（缺省 Paper + Waterfall）。
          val e2eProxy = (findProperty("e2e.proxy") as String?) ?: "waterfall"
          val e2eBackend = (findProperty("e2e.backend") as String?) ?: "paper"
          val e2eBackendVersion = (findProperty("e2e.backendVersion") as String?) ?: "1.20.1"

          mcTestkit {
              backend("s1") {
                  platform = if (e2eBackend == "folia") folia else paper
                  version = e2eBackendVersion; port = 25565
              }
              backend("s2") {
                  platform = if (e2eBackend == "folia") folia else paper
                  version = e2eBackendVersion; port = 25566
              }
              proxy("px") {
                  platform = when (e2eProxy) { "bungeecord" -> bungeecord; "velocity" -> velocity; else -> waterfall }
                  port = 25577; routesTo("s1", "s2")
              }
              // 单后端烟雾：无 bot、无代理，最轻（Folia 自举亦跑此，-Pe2e.backend=folia）
              scenario("smoke") { backend = "s1" }
              // 机器人驱动单后端：注册 e2eExampleBotWithBot（直连）+ e2eExampleBotViaPx（经代理，平台由 -Pe2e.proxy 定）
              scenario("example-bot") {
                  backend = "s1"; via = "px"
                  bot { username = "ProbeBot"; action = "example-bot" }
              }
              // 集群跨服：2 后端 + 代理单 listener + bot 经代理 /server 切换
              scenario("cross-server") {
                  backends("s1", "s2"); via = "px"
                  bot { username = "Switcher"; action = "cross-server" }
              }
              // 持续压测：2 服 + 代理 N-listener 钉服 + 每服 2 bot 短时施压（Velocity 单端口不支持钉服，跳过）
              if (e2eProxy != "velocity") {
                  scenario("continuous-stress") {
                      backends("s1", "s2"); via = "px"
                      stress { botsPerServer = 2; durationSeconds = 20 }
                      bot { username = "Stress"; action = "continuous-stress" }
                  }
              }
              // 单场景多 bot（FR-16）：单后端直连 3 个各唯一 username 的 bot（P1/P2/P3，经 BOT_INDEX 区分）
              scenario("multi-bot") {
                  backend = "s1"
                  bot { username = "P"; action = "multi-bot"; count = 3 }
              }
              // 崩溃接管 fallback（FR-15）：2 后端 + 代理，默认后端宕机 → bot 经代理回退到存活后端确认到达
              scenario("crash-takeover") {
                  backends("s1", "s2"); via = "px"
                  bot { username = "Reconnector"; action = "crash-takeover" }
              }
              // 自举：桩骨架自身即被测对象（经 HARNESS_JAR 注入两后端）
              dependencies { pluginUnderTest = "HARNESS_JAR" }
          }
          EOF
          {
            echo "CONSUMER=$CONSUMER"
            echo "HARNESS_JAR=$GITHUB_WORKSPACE/template/harness/build/libs/mc-testkit-e2e-harness-1.0.0-SNAPSHOT.jar"
          } >> "$GITHUB_ENV"

      - name: E2E · 单后端烟雾（e2eSmoke）
        run: ./gradlew -p "$CONSUMER" e2eSmoke -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 单服 + bot 直连（e2eExampleBotWithBot）
        run: ./gradlew -p "$CONSUMER" e2eExampleBotWithBot -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 经 Waterfall 代理单后端 + bot（e2eExampleBotViaPx）
        run: ./gradlew -p "$CONSUMER" e2eExampleBotViaPx -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 单场景多 bot（e2eMultiBotWithBot + 唯一 username 断言）
        run: |
          ./gradlew -p "$CONSUMER" e2eMultiBotWithBot -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace
          RESULT="$CONSUMER/build/mc-testkit/results/multi-bot.properties"
          echo "结果文件内容："; cat "$RESULT"
          for u in P1 P2 P3; do
            grep -q "$u" "$RESULT" || { echo "::error::单场景多 bot 缺少唯一 username $u（FR-16 多进程身份注入未生效）"; exit 1; }
          done
          echo "单场景多 bot 唯一 username P1/P2/P3 均入服 ✓"

      - name: E2E · 集群跨服（e2eCrossServerCluster）
        run: ./gradlew -p "$CONSUMER" e2eCrossServerCluster -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 崩溃接管 fallback（e2eCrashTakeoverCluster）
        run: ./gradlew -p "$CONSUMER" e2eCrashTakeoverCluster -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 持续压测（e2eContinuousStressStress）
        run: ./gradlew -p "$CONSUMER" e2eContinuousStressStress -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 经 BungeeCord 代理集群跨服（e2eCrossServerCluster，-Pe2e.proxy=bungeecord）
        run: ./gradlew -p "$CONSUMER" e2eCrossServerCluster -Pe2e.proxy=bungeecord -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · Folia 后端烟雾（e2eSmoke，-Pe2e.backend=folia）
        run: ./gradlew -p "$CONSUMER" e2eSmoke -Pe2e.backend=folia -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 经 Velocity 代理单后端 + bot（e2eExampleBotViaPx，-Pe2e.proxy=velocity）
        run: ./gradlew -p "$CONSUMER" e2eExampleBotViaPx -Pe2e.proxy=velocity -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: E2E · 经 Velocity 代理集群跨服（e2eCrossServerCluster，-Pe2e.proxy=velocity）
        run: ./gradlew -p "$CONSUMER" e2eCrossServerCluster -Pe2e.proxy=velocity -PmcTestkit.botDir="$GITHUB_WORKSPACE/template/bot" --no-daemon --stacktrace

      - name: 归档运行日志与结果（失败排查）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            ${{ env.CONSUMER }}/build/mc-testkit/**/*.log
            ${{ env.CONSUMER }}/build/mc-testkit/results/**
          if-no-files-found: ignore
