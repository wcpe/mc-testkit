# mc-testkit 发版：打 `vX.Y.Z` tag 触发——校验版本一致 → 发布构件到私有仓库 → 建 GitHub Release。
#
# 为什么是「打 tag 触发」而不是「合并即自动发版」：GitHub Actions 的硬约束——用 GITHUB_TOKEN
# 建的 tag 不会触发其它 workflow（防递归），所以「CI 自己打 tag 再发布」必须引入长期 PAT。
# 这里选择零额外凭据的形态：维护者打 tag（一条 gh 命令），发布动作全在 CI 完成——不再需要本地
# 跑 ./gradlew publish、手工建 Release、手抄 CHANGELOG。
#
# 发版步骤（详见 docs/CONTRIBUTING.md §8）：
#   1) 在 PR 里 bump 根 `VERSION` 并把 CHANGELOG 未发布段定稿为 `## [X.Y.Z] - YYYY-MM-DD`
#   2) PR 合入 master（CI 必须绿）
#   3) 打 tag：`git tag vX.Y.Z && git push origin vX.Y.Z`（或 `gh release create` 前先打 tag）
#   4) 本工作流自动发布到 maven.wcpe.top + 建 GitHub Release（正文取 CHANGELOG 该段）
#
# 凭据走仓库 secret（见 docs/OPERATIONS.md §1）：WCPE_MAVEN_USERNAME / WCPE_MAVEN_PASSWORD。
# 承载在 `release` environment 上，便于加人工审批与环境保护规则。
name: Release

on:
  push:
    tags: ['v*']

# 同一 tag 重复推送时取消旧运行（正常不会发生；防手工重推造成并发发布）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 建 Release 需要写权限

jobs:
  release:
    name: 发布到 maven.wcpe.top 并建 Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 取完整历史与 tag，便于在日志里核对发布点的提交
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（带依赖 / 构建缓存）
        uses: gradle/actions/setup-gradle@v5

      # 版本一致性前置校验：tag 是发版的输入，VERSION 是版本号唯一真源（架构不变量），
      # 二者不一致说明 tag 打错了点或忘了 bump，必须**在发布前**失败——否则会往仓库推一个
      # 与 tag 不符的构件，事后只能靠发新版本纠正（已发布的 Maven 构件不可覆盖）。
      - name: 校验 tag 与 VERSION 一致
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$GITHUB_REF_NAME tag版本=$TAG_VERSION VERSION文件=$FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag（$GITHUB_REF_NAME）与 VERSION 文件（$FILE_VERSION）不一致：请先把 VERSION 改为 $TAG_VERSION 并合入 master，再重新打 tag。"
            exit 1
          fi
          # CHANGELOG 必须已有该版本段落，否则 Release 正文会为空、且说明未按发版流程定稿
          if ! grep -qE "^##\s+\[?${FILE_VERSION}\]?(\s|\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少版本 $FILE_VERSION 的段落：请先在 PR 里把未发布段定稿为 '## [$FILE_VERSION] - YYYY-MM-DD' 并合入 master。"
            exit 1
          fi
          echo "版本一致性校验通过：$FILE_VERSION"

      # 发布前跑一次验证门：tag 可能打在未经 CI 的提交上（如直接从本地推 tag），
      # 这里兜底保证绝不发布门禁未过的构件。
      - name: 验证门（构建 + 风格检查 + 全部测试）
        run: ./gradlew build --no-daemon --stacktrace

      - name: 发布构件到 maven.wcpe.top
        env:
          WCPE_MAVEN_USERNAME: ${{ secrets.WCPE_MAVEN_USERNAME }}
          WCPE_MAVEN_PASSWORD: ${{ secrets.WCPE_MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WCPE_MAVEN_USERNAME:-}" ] || [ -z "${WCPE_MAVEN_PASSWORD:-}" ]; then
            echo "::error::缺少发布凭据：请在仓库 Settings → Environments → release 配置 secrets WCPE_MAVEN_USERNAME / WCPE_MAVEN_PASSWORD（见 docs/OPERATIONS.md §1）。"
            exit 1
          fi
          ./gradlew publish --no-daemon --stacktrace

      - name: 生成 Release 正文（取 CHANGELOG 该版本段）
        run: |
          set -euo pipefail
          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          python3 .github/scripts/release_notes.py CHANGELOG.md "$VERSION_FILE" --require > RELEASE_BODY.md
          # 首行固定标题，正文接 CHANGELOG 段落（与既有 Release 形态一致）
          { echo "# mc-testkit v$VERSION_FILE"; echo; cat RELEASE_BODY.md; } > RELEASE_NOTES.md
          echo "Release 正文行数：$(wc -l < RELEASE_NOTES.md)"

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
          echo "已建 Release：$GITHUB_REF_NAME"
